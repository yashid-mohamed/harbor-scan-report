name: "Build Tag"

on:
  push:
    tags:
      - '*'

jobs:
  docker-image:
    name: Build Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Latest Tag
        id: get_tag
        uses: WyriHaximus/github-action-get-previous-tag@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: docker build -t ghcr.io/${{ github.repository_owner }}/hsr:trunk . && docker push ghcr.io/${{ github.repository_owner }}/hsr:trunk

      - name: Build and push
        run: docker build -t ghcr.io/${{ github.repository_owner }}/hsr:${{ steps.get_tag.outputs.tag }} . && docker push ghcr.io/${{ github.repository_owner }}/hsr:${{ steps.get_tag.outputs.tag }}
